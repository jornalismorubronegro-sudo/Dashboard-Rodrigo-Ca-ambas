<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Nova locação de caçamba - Rodrigo Caçambas" />
  <meta name="theme-color" content="#591c31" />
  <title>Nova Locação | Rodrigo Caçambas</title>
  <link rel="stylesheet" href="novo-agendamento.css" />
</head>

<body data-page="novo-agendamento">
  <div class="app-container">
    <header class="page-header">
      <a href="principal.html" class="btn-voltar" aria-label="Voltar para Painel de Controle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
      <div class="page-header-content">
        <h1 class="section-title">
          <p class="page-subtitle">
      </div>
    </header>

    <main class="main-section">
      <form id="formNovoAgendamento">

        <section class="form-card">
          <h2 class="card-title">
            Dados do Cliente
          </h2>

          <div class="form-group">
            <label class="form-label" for="nomeCliente">Nome do Cliente</label>
            <input id="nomeCliente" name="nomeCliente" type="text" class="input" placeholder="Ex: João Silva" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="tel" class="input" placeholder="(11) 99999-9999" required pattern="\([0-9]{2}\)\s?[0-9]{4,5}-[0-9]{4}" title="Use o formato (11) 99999-9999" />
          </div>

          <div class="form-group">
            <label class="form-label" for="cpfCnpj">CPF/CNPJ</label>
            <input id="cpfCnpj" name="cpfCnpj" type="text" class="input" placeholder="Opcional" />
          </div>
        </section>

        <section class="form-card">
          <h2 class="card-title">
            Local da Entrega
          </h2>
          <div class="form-group">
            <label class="form-label" for="enderecoEntrega">Endereço da Entrega</label>
            <input id="enderecoEntrega" name="enderecoEntrega" type="text" class="input" placeholder="Rua, número e complemento" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="bairro">Bairro</label>
            <input id="bairro" name="bairro" type="text" class="input" placeholder="Ex: Centro" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="cidade">Cidade</label>
            <input id="cidade" name="cidade" type="text" class="input" placeholder="Ex: São Paulo" required />
          </div>
        </section>

        <section class="form-card">
          <h2 class="card-title">
            Dados da Locação
          </h2>
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="quantidade">Quantidade de Caçambas</label>
              <input id="quantidade" name="quantidade" type="number" class="input" placeholder="Ex: 1" min="1" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="valorLocacao">Valor da Locação</label>
              <input id="valorLocacao" name="valorLocacao" type="number" step="0.01" class="input" placeholder="Ex: 1200,00" required />
            </div>
        </section>

        <section class="form-card">
          <h2 class="card-title">
            Datas
          </h2>
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="dataEntrega">Data da Entrega</label>
              <input id="dataEntrega" name="dataEntrega" type="date" class="input" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="dataRetirada">Data da Retirada Prevista</label>
              <input id="dataRetirada" name="dataRetirada" type="date" class="input" />
            </div>
        </section>

        <section class="form-card">
          <h2 class="card-title">
            Status
          </h2>
          <div class="form-group">
            <label class="form-label" for="statusLocacao">Status da Locação</label>
            <select id="statusLocacao" name="statusLocacao" class="input" style="width:100%;" required>
              <option value="agendado">Agendado</option>
              <option value="em-uso">Em Uso</option>
              <option value="retirado">Retirado</option>
              <option value="cancelado">Cancelado</option>
            </select>
          </div>
        </section>

        <section class="form-card">
          <h2 class="card-title">
            Observações
          </h2>
          <div class="form-group">
            <label class="form-label" for="observacoes">Observações</label>
            <textarea id="observacoes" name="observacoes" class="input" placeholder="Anotações adicionais" rows="5"></textarea>
          </div>
        </section>

        <div class="form-actions">
          <a href="principal.html" class="button button--secondary">Cancelar</a>
          <button id="btnSalvarAgendamento" type="submit" class="button button--primary button-full">Criar Locação</button>
        </div>
      </form>
    </main>
  </div>
  <div id="feedback-msg" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#3A3A71; color:white; padding:12px 24px; border-radius:8px; font-weight:600; box-shadow:0 4px 6px rgba(0,0,0,0.2);">
    Pedido criado com sucesso!
  </div>
  <script type="module" src="novo-agendamento.js"></script>
</body>

</html>
