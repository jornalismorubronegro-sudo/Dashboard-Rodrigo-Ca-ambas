<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Painel de gestão e controle da Rodrigo Caçambas">
  <meta name="theme-color" content="#591c31">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <title>Painel de Controle | Rodrigo Caçambas</title>

  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="principal.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body data-page="principal">

  <div class="app-container">

    <header class="principal-header">
      <nav class="principal-nav" aria-label="Navegação principal">
        <a href="index.html" class="btn-voltar" aria-label="Voltar ao início">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
        <h1 class="principal-title">
          Painel de Controle
        </h1>
        <a href="index.html" class="btn-sair" style="text-decoration: none; display: inline-block; text-align: center;">Sair</a>
      </nav>

      <div class="profile-card">
        <div class="profile-info">
          <p class="profile-greeting">
            Sistema de Gestão
          </p>
          <h2 id="nome-cliente" class="profile-name">Rodrigo Arruda</h2>
        </div>
        <div class="profile-avatar profile-avatar-placeholder">
          🚛
        </div>
      </div>

      <div class="header-actions">
        <form class="search-form" role="search" action="#" onsubmit="return false;">
          <input type="search" class="search-input" placeholder="Pesquisar Cliente" aria-label="Pesquisar">
          <button class="search-btn" aria-label="Pesquisar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M21 21l-4.35-4.35" stroke="#a9a9a9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="11" cy="11" r="6" stroke="#a9a9a9" stroke-width="2" />
            </svg>
          </button>
        </form>


      </div>
    </header>

    <div class="app-content">
      <main class="principal-main">
        <section class="principal-services" aria-labelledby="services-title">
          <h3 id="services-title">
            Acesso Rápido
          </h3>
          <ul class="services-list">
            <li>
              <a href="novo-agendamento.html" class="service-row">
                <span class="service-icon"></span>
                <span class="service-label">Criar Formulário</span>
                <span class="service-chevron">›</span>
              </a>
            </li>
            <li>
              <a href="dashboard.html" class="service-row">
                <span class="service-icon"></span>
                <span class="service-label">Dashboard</span>
                <span class="service-chevron">›</span>
              </a>
            </li>
            <li>
              <a href="clientes.html" class="service-row">
                <span class="service-icon"></span>
                <span class="service-label">Clientes</span>
                <span class="service-chevron">›</span>
              </a>
            </li>
          </ul>
        </section>





    </div>

    <script type="module" src="analytics.js"></script>
    <script type="module" src="vitrine.js" defer></script>
    <script type="module" src="principal.js" defer></script>
    <script type="module" src="principal-categories.fixed.js" defer></script>
    <script src="app.js" defer></script>
</body>

</html>
